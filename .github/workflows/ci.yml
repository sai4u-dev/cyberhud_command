name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend lint+test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: OpenAPI spec parses
        run: node -e "require('yamljs').load('src/docs/openapi.yaml'); console.log('openapi OK')"
      - run: npm run lint --if-present
      - run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/cyberhud_test
          JWT_ACCESS_SECRET: ci_access_secret_32chars_minimum_xxx
          JWT_REFRESH_SECRET: ci_refresh_secret_32chars_minimum_xx
          FRONTEND_URL: http://localhost:5173

  frontend:
    name: frontend lint+build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint --if-present
      - run: npm run build
        env:
          VITE_API_URL: /api

  docker:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-action@v6
        with:
          context: ./backend
          push: false
          tags: cyberhud-backend:ci
      - name: Build frontend image
        uses: docker/build-action@v6
        with:
          context: ./frontend
          push: false
          tags: cyberhud-frontend:ci

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: frontend
